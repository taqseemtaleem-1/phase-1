    <!-- Vertical Stem -->
    <path d="M 120 60 L 120 340" />
    <!-- Round Curved Loop -->
    <path d="M 120 60 C 270 60, 270 200, 120 200" />
    <!-- Diagonal Leg from Center Junction -->
